<html lang="ru">
<head>

    th:first-child, td:first-child { text-align: left; }
    td:first-child { min-width: 260px; max-width: 500px; overflow-wrap: anywhere; white-space: normal; }
    th { background: #e5efeb; }
    button { color: #205e53; font: inherit; font-weight: 700; border: 0; background: none; cursor: pointer; }
    button:focus-visible { outline: 2px solid #205e53; outline-offset: 3px; }
    caption { text-align: left; padding: 12px 0; }
  </style>

  <h1>Nginx Log Analyzer</h1>

    <table id="report-table">

</html>
